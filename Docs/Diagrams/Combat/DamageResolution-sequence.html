<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 1-2 战斗系统-时序图</title>
<style>
  :root {
    --paper: #f5f5f5;
    --ink: #2d3142;
    --ink-soft: #5b6072;
    --accent: #eb6c36;
  }
  html, body { margin: 0; padding: 0; background: #d8d8d8; }
  .page { display: flex; justify-content: center; padding: 24px; }
  svg { background: var(--paper); box-shadow: 0 2px 12px rgba(0,0,0,.18); max-width: 100%; height: auto; }
  text { fill: var(--ink); }
  .eyebrow   { font: 600 10px "Geist Mono","Noto Sans SC",monospace; letter-spacing: .18em; fill: var(--ink-soft); }
  .title     { font: 400 32px "Instrument Serif","Noto Sans SC",serif; }
  .actor-cn  { font: 600 12px "Geist","Noto Sans SC",sans-serif; }
  .actor-en  { font: 400 9px "Geist Mono",monospace; fill: var(--ink-soft); }
  .msg-lbl   { font: 400 11px "Noto Sans SC","Geist",sans-serif; }
  .msg-code  { font: 400 9px "Geist Mono",monospace; fill: var(--ink-soft); }
  .note-txt  { font: 400 10px "Noto Sans SC","Geist",sans-serif; fill: var(--ink-soft); }
  .caption   { font: 400 12px "Noto Sans SC","Geist",sans-serif; fill: var(--ink-soft); }
  .actor-box { fill: #ffffff; stroke: var(--ink); stroke-width: 1.5; }
  .lifeline  { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 4 4; }
  .msg       { stroke: var(--ink); stroke-width: 1.4; fill: none; }
  .msg-self  { stroke: var(--ink); stroke-width: 1.4; fill: none; }
  .activation{ fill: #ffffff; stroke: var(--ink); stroke-width: 1.2; }
  .note      { fill: #e8eaee; stroke: var(--ink-soft); stroke-width: 1; }
</style>
</head>
<body>
<div class="page">
<svg viewBox="0 0 1120 792" width="1120" height="792" role="img" aria-label="图 1-2 战斗系统-时序图">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3142"/>
    </marker>
  </defs>

  <!-- 页眉 -->
  <text class="eyebrow" x="40" y="64">ELDEN · 图 1-2 战斗系统-时序图</text>
  <text class="title" x="40" y="104">伤害结算执行链</text>

  <!-- ══ 参与者（6 个） ══ -->
  <g>
    <rect class="actor-box" x="70"  y="132" width="140" height="44" rx="6"/>
    <text class="actor-cn" x="140" y="151" text-anchor="middle">武器动画</text>
    <text class="actor-en" x="140" y="167" text-anchor="middle">Animation Event</text>

    <rect class="actor-box" x="250" y="132" width="140" height="44" rx="6" stroke="#eb6c36" stroke-width="2"/>
    <text class="actor-cn" x="320" y="151" text-anchor="middle">伤害碰撞体</text>
    <text class="actor-en" x="320" y="167" text-anchor="middle">DamageCollider</text>

    <rect class="actor-box" x="430" y="132" width="140" height="44" rx="6"/>
    <text class="actor-cn" x="500" y="151" text-anchor="middle">网络管理器</text>
    <text class="actor-en" x="500" y="167" text-anchor="middle">CharacterNetworkManager</text>

    <rect class="actor-box" x="610" y="132" width="140" height="44" rx="6"/>
    <text class="actor-cn" x="680" y="151" text-anchor="middle">特效管理器</text>
    <text class="actor-en" x="680" y="167" text-anchor="middle">CharacterEffectsManager</text>

    <rect class="actor-box" x="790" y="132" width="140" height="44" rx="6"/>
    <text class="actor-cn" x="860" y="151" text-anchor="middle">伤害效果</text>
    <text class="actor-en" x="860" y="167" text-anchor="middle">TakeDamageEffect</text>

    <rect class="actor-box" x="970" y="132" width="140" height="44" rx="6"/>
    <text class="actor-cn" x="1040" y="151" text-anchor="middle">属性管理器</text>
    <text class="actor-en" x="1040" y="167" text-anchor="middle">CharacterStatsManager</text>
  </g>

  <!-- ══ 生命线 ══ -->
  <line class="lifeline" x1="140"  y1="176" x2="140"  y2="700"/>
  <line class="lifeline" x1="320"  y1="176" x2="320"  y2="700"/>
  <line class="lifeline" x1="500"  y1="176" x2="500"  y2="700"/>
  <line class="lifeline" x1="680"  y1="176" x2="680"  y2="700"/>
  <line class="lifeline" x1="860"  y1="176" x2="860"  y2="700"/>
  <line class="lifeline" x1="1040" y1="176" x2="1040" y2="700"/>

  <!-- ══ 消息 ══ -->
  <!-- 1. 动画事件开启伤害窗口 -->
  <path class="msg" d="M140,208 L314,208" marker-end="url(#arrow)"/>
  <text class="msg-lbl"  x="150" y="196">动画事件开启伤害窗口</text>
  <text class="msg-code" x="150" y="222">OpenDamageCollider()</text>

  <!-- 2. 自调用：触发检测 -->
  <path class="msg-self" d="M320,252 L354,252 L354,268 L326,268" marker-end="url(#arrow)"/>
  <text class="msg-lbl" x="364" y="256">OnTriggerEnter 命中目标躯干碰撞体</text>
  <text class="msg-code" x="364" y="270">m_charactersDamaged 去重，防止重复命中</text>

  <!-- 3. 自调用：弹反/格挡判定 -->
  <path class="msg-self" d="M320,296 L354,296 L354,312 L326,312" marker-end="url(#arrow)"/>
  <text class="msg-lbl" x="364" y="300">弹反 / 格挡判定</text>
  <text class="msg-code" x="364" y="314">CheckForParry · CheckForBlock（点积方向判定）</text>

  <!-- 4. 服务器权威 RPC -->
  <path class="msg" d="M320,344 L494,344" marker-end="url(#arrow)"/>
  <text class="msg-lbl"  x="330" y="332">请求伤害结算（服务器权威）</text>
  <text class="msg-code" x="330" y="358">Damage() → RequestCharacterDamageServerRpc</text>

  <!-- 服务器权威说明 -->
  <rect class="note" x="452" y="372" width="236" height="30" rx="4"/>
  <text class="note-txt" x="462" y="391">服务器校验目标存活与无敌状态后下发</text>

  <!-- 5. 网络 → 特效 -->
  <path class="msg" d="M500,424 L674,424" marker-end="url(#arrow)"/>
  <text class="msg-lbl"  x="510" y="412">本地应用伤害</text>
  <text class="msg-code" x="510" y="438">ApplyDamageLocally → ProcessRuntimeInstantEffect</text>

  <!-- 6. 特效 → 伤害效果 -->
  <path class="msg" d="M680,468 L854,468" marker-end="url(#arrow)"/>
  <text class="msg-lbl"  x="690" y="456">执行运行时伤害效果</text>
  <text class="msg-code" x="690" y="482">ProcessEffect(runtimeEffect)</text>

  <!-- 7. 自调用：伤害计算 -->
  <path class="msg-self" d="M860,512 L894,512 L894,528 L866,528" marker-end="url(#arrow)"/>
  <text class="msg-lbl" x="904" y="516">伤害数值计算</text>
  <text class="msg-code" x="904" y="530">CalculateDamage：五属性叠加 + 格挡减伤 + 无敌判定</text>

  <!-- 8. 伤害效果 → 属性 -->
  <path class="msg" d="M860,560 L1034,560" marker-end="url(#arrow)"/>
  <text class="msg-lbl"  x="870" y="548">扣减生命与韧性</text>
  <text class="msg-code" x="870" y="574">ApplyHealthDamage · PoiseDamage（破韧判定）</text>

  <!-- 9. 自调用：受击表现 -->
  <path class="msg-self" d="M860,604 L894,604 L894,620 L866,620" marker-end="url(#arrow)"/>
  <text class="msg-lbl" x="904" y="608">方向性受击表现</text>
  <text class="msg-code" x="904" y="622">CalculateHitAngle → 受击动画 + DamageSound</text>

  <!-- 结果回传（虚线） -->
  <path class="msg" d="M1034,652 L146,652" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text class="msg-lbl" x="480" y="644">网络变量同步：HP / 死亡状态 → HUD 与布娃娃表现</text>

  <!-- 图题 -->
  <text class="caption" x="560" y="766" text-anchor="middle">图 1-2 战斗系统-时序图</text>
</svg>
</div>
</body>
</html>
