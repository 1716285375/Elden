name: Windows Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release containing the locally built Windows player
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          persist-credentials: false
      - name: Verify Windows package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./BuildScripts/VerifyWindowsRelease.ps1
